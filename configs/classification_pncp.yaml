# Classificação sobre corpus PNCP DF/2025 (~20k compras).
# Gerar corpus: python scripts/run_preprocess_pncp.py
# Corpus: esfera D (GDF distrital) + ano 2025 -> data/processed/pncp_corpus_gdf2025.jsonl

task: classification
model: baseline
run_prefix: pncp
text_field: objeto_html_limpo
seed: 42

val_size: 0.15
test_size: 0.15

params:
  ngram_max: 2
  min_df: 2
  max_features: 20000
  C: 1.0
  max_iter: 1000
  class_weight: balanced

  svm_kernel: linear
  svm_probability: true

  model_name: neuralmind/bert-base-portuguese-cased
  max_length: 512
  batch_size: 32
  learning_rate: 2.0e-5
  epochs: 3
  early_stopping_patience: 1
