# Fine-tuning BERTimbau — máquina com GPU (ex.: RTX 4090, 24 GB).
# Uso: python scripts/run_train.py --config configs/classification_bert_gpu.yaml
#
# Quem não tem GPU: não rode este config — use baseline ou leia docs/GPU-EQUIPE.md

task: classification
model: bertimbau
text_field: objeto_html
seed: 42

val_size: 0.15
test_size: 0.15

params:
  model_name: neuralmind/bert-base-portuguese-cased
  max_length: 512
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 4
  early_stopping_patience: 2
