[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-pln-project"
version = "0.1.0"
description = "PLN aplicado a editais de licitações públicas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.0",
    "ruff>=0.9.0",
    "pytest>=8.0",
    "types-requests",
    "types-beautifulsoup4",
    "types-PyYAML",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src"]
exclude = ["notebooks", "scripts"]
namespace_packages = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "mlflow.*",
    "matplotlib.*",
    "joblib.*",
    "torch.*",
    "transformers.*",
    "datasets.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["notebooks", "scripts", ".venv"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/test_dataset.py" = ["N806"]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
